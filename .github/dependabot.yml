version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # stylelint と stylelint-config-standard は peer で噛み合っているので、
      # major も含めて一括で上げないと npm ci が ERESOLVE で落ちる。
      dev-tooling:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
