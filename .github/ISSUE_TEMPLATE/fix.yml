name: Fix information
description: Closed, moved, wrong price, missing coordinates
title: "[fix] "
labels: ["fix"]
body:
  - type: input
    id: shop
    attributes:
      label: Which place
      placeholder: 無敵家 (mutekiya)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What needs fixing
      options:
        - Closed or on hiatus
        - Moved
        - Hours or closing day
        - Price
        - Description or tags
        - Add coordinates
        - Not actually fine alone
        - Something else
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What it should say
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where this comes from
