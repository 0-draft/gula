name: Score a place
description: Give a place a number out of ten
title: "[visit] "
labels: ["rating"]
body:
  - type: textarea
    id: lines
    attributes:
      label: One place per line
      description: |
        `name score`, optionally a date and `memo=`. Names match loosely, so a
        branch suffix or the shops.json id both work. `clear` forgets a place.
      placeholder: |
        無敵家 8.5
        開楽 7 2026-09-16
        新珍味 9 memo=ターロー飯がうまい
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Pasted from the app
      description: The JSON from "Save as an issue", if you used it
      render: json
