name: Add a shop
description: Somewhere that is missing from the list
title: "[add] "
labels: ["shop"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: In Japanese, as it appears on the shop
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["西口 West exit", "北口 North exit", "東口 East exit", "南池袋 Minami-Ikebukuro", "東池袋 Higashi-Ikebukuro", "駅ナカ In the station", "周縁 Outskirts"]
    validations:
      required: true
  - type: dropdown
    id: genre
    attributes:
      label: Genre
      options:
        - Ramen (ramen)
        - Set meal (teishoku)
        - Chinese (chinese)
        - Curry (curry)
        - Soba & udon (soba)
        - Western (yoshoku)
        - Yakiniku (yakiniku)
        - Yakitori (yakitori)
        - Sushi (sushi)
        - Asian (ethnic)
        - Korean (korean)
        - Coffee house (kissa)
        - Standing bar (nomi)
        - Late night (late)
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Address
      description: As precise as you can get it; a block number is enough to map it
  - type: input
    id: price
    attributes:
      label: Rough price
      placeholder: 〜¥999
  - type: input
    id: hours
    attributes:
      label: Hours and closing day
  - type: textarea
    id: note
    attributes:
      label: What the place is like
      description: Whether you can go alone, what to order, how busy it gets
  - type: input
    id: source
    attributes:
      label: Where this comes from
      description: Been there / a URL / word of mouth
